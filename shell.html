<title>root@user:~# python3 murtiCV.py</title>

<style>
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
    background:#0d0d0d;
    color:#00ff00;
    font-family:"Courier New",monospace;
    padding:20px;
    margin:0;
    line-height:1.6;
    user-select:none;
    -webkit-user-select:none;
}
.terminal-window {
    width:100%;
    max-width:800px;
    margin:0 auto;
    border:1px solid #333;
    background:#121212;
    padding:20px;
    box-shadow:0 0 20px rgba(0,255,0,.20);
    border-radius:5px;
}
.header {
    border-bottom:1px solid #333;
    padding-bottom:10px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}
.dots span {
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:5px;
}
.dot-red { background:#ff5f56; }
.dot-yellow { background:#ffbd2e; }
.dot-green { background:#27c93f; }

.translate-wrapper { position:relative; display:inline-block; }
#google_translate_element {
    display:none;
    position:absolute;
    right:0;
    top:calc(100% + 8px);
    z-index:50;
    background:#171717;
    border:1px solid #00ff00;
    padding:8px;
    min-width:180px;
}
.custom-translate-btn {
    background:#00ff00;
    color:#050505;
    border:1px solid #00ff00;
    padding:10px 14px;
    cursor:pointer;
    font-family:"Courier New",monospace;
    font-weight:bold;
    font-size:14px;
    transition:.2s;
}
.custom-translate-btn:hover {
    background:#050505;
    color:#00ff00;
}
.custom-translate-btn:disabled {
    opacity:.35;
    cursor:not-allowed;
}
.prompt { color:#00ff00; font-weight:bold; }
.command { color:#fff; }
.output {
    color:#a9ffaf;
    margin:8px 0 25px;
    white-space:pre-line;
}
.json-box {
    background:#050505;
    border-left:3px solid #00ff00;
    padding:15px;
    color:#00bcff;
    font-size:14px;
    overflow-x:auto;
    margin:8px 0 25px;
    white-space:pre;
}
.terminal-line {
    margin:10px 0 4px;
    min-height:1.6em;
}
.status-ok { color:#a9ffaf; }
.cursor {
    animation:blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity:0; } }
footer {
    text-align:center;
    margin-top:40px;
    color:#555;
    font-size:12px;
}
.boot-line {
    color:#777;
    margin:3px 0;
}
body.translated { top:0 !important; }
.goog-te-banner-frame.skiptranslate { display:none !important; }
.goog-te-gadget { font-size:0 !important; }
.goog-te-gadget .goog-te-combo {
    font-family:"Courier New",monospace;
    font-size:13px;
    background:#050505;
    color:#00ff00;
    border:1px solid #00ff00;
    padding:6px;
    width:100%;
}
@media (max-width:600px) {
    body { padding:10px; }
    .terminal-window { padding:14px; }
    .header { align-items:flex-start; }
    .custom-translate-btn { font-size:12px; padding:8px 10px; }
    .json-box { font-size:12px; padding:10px; }
    footer { margin-top:25px; }
}
</style>

<script>
document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
document.addEventListener("keydown", function(e) {
    if (e.key === "F12") e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) e.preventDefault();
    if (e.ctrlKey && e.key.toUpperCase() === "U") e.preventDefault();
});
</script>
</head>

    <div id="terminal-content">

function decodeHtml(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeText(element, text, speed=18) {
    element.textContent = "";
    for (const char of text) {
        element.textContent += char;
        await sleep(speed);
    }
}

async function bootSequence() {
    const boot = document.getElementById("boot");

    const lines = [
        "BIOS :: murtiCV boot sequence initialized",
        "KERNEL :: loading personal profile...",
        "SECURITY :: encoded payload verified",
        "NETWORK :: GitHub Pages connection established",
        "SYSTEM :: ready"
    ];

    for (const line of lines) {
        const div = document.createElement("div");
        div.className = "boot-line";
        boot.appendChild(div);
        await typeText(div, line, 14);
        await sleep(180);
    }

    await sleep(500);
    boot.innerHTML = "";
}

async function showProfile() {
    const profile = document.getElementById("profile");
    const decoded = decodeHtml(encryptedData);

    /*
      İçeriği parçalara ayırıp terminal hissi veriyoruz.
      HTML'in kendisi Base64 içinden geliyor; decode sonrası DOM'a ekleniyor.
    */
    const temp = document.createElement("div");
    temp.innerHTML = decoded;

    const children = Array.from(temp.children);

    for (const child of children) {
        const clone = child.cloneNode(true);
        clone.style.opacity = "0";
        clone.style.transition = "opacity .35s ease";
        profile.appendChild(clone);

        await sleep(250);
        clone.style.opacity = "1";

        if (clone.classList.contains("terminal-line")) {
            await sleep(650);
        } else {
            await sleep(900);
        }
    }

    document.getElementById("translateBtn").disabled = false;
    document.getElementById("translateBtn").textContent = "Select_Language() 🌐";
}

async function startTerminal() {
    await bootSequence();
    await showProfile();
}

function openTranslate() {
    const box = document.getElementById("google_translate_element");
    if (document.getElementById("translateBtn").disabled) return;

    box.style.display = box.style.display === "block" ? "none" : "block";
}

function googleTranslateElementInit() {
    new google.translate.TranslateElement(
        {
            pageLanguage: "tr",
            includedLanguages: "tr,en,de,es,fr,it,pt,ru,ar,zh-CN,ja,ko,nl,pl"
        },
        "google_translate_element"
    );
}

startTerminal();
